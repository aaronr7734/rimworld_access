name: Tests

# Runs the game-free unit tests (pure logic extracted from the mod, e.g. the
# screen-reader text sanitizer). These link source files directly and target
# net10.0, so they need no RimWorld/Unity assemblies and run in seconds.
# Also runs scripts/check_shell_demolition.py, a static lint that locks in
# the keyboard-shell demolition (see that script's own
# docstring).

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Run tests
        run: dotnet test tests/RimWorldAccess.Tests/RimWorldAccess.Tests.csproj

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run shell demolition lint
        run: python3 scripts/check_shell_demolition.py

      - name: Run inspection doctrine lint
        run: python3 scripts/check_inspection_doctrine.py

      - name: Run mutation doctrine lint
        run: python3 scripts/check_mutation_doctrine.py

      - name: Compile against RimWorld 1.7
        run: python3 scripts/check_api_17.py
