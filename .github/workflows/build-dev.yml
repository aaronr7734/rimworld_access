name: Build Dev Release

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: dev-release
  cancel-in-progress: true

jobs:
  build:
    if: github.repository == 'aaronr7734/rimworld_access'
    runs-on: windows-2022
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Download Prism native libraries
        shell: bash
        run: |
          mkdir -p native

          # Download Windows x64
          curl -sL "https://github.com/ethindp/prism/releases/latest/download/prism-windows-x64.zip" -o prism-win.zip
          unzip -o prism-win.zip -d prism-win-tmp
          cp prism-win-tmp/dynamic/release/bin/prism.dll native/prism.dll
          rm -rf prism-win.zip prism-win-tmp

          # Download macOS universal
          curl -sL "https://github.com/ethindp/prism/releases/latest/download/prism-macos-universal.zip" -o prism-mac.zip
          unzip -o prism-mac.zip -d prism-mac-tmp
          cp prism-mac-tmp/dynamic/release/lib/libprism.dylib native/libprism.dylib
          rm -rf prism-mac.zip prism-mac-tmp

          # Download Linux x64
          curl -sL "https://github.com/ethindp/prism/releases/latest/download/prism-linux-x64.zip" -o prism-linux.zip
          unzip -o prism-linux.zip -d prism-linux-tmp
          cp prism-linux-tmp/dynamic/release/lib/libprism.so native/libprism.so
          rm -rf prism-linux.zip prism-linux-tmp

          echo "Native libraries downloaded:"
          ls -la native/

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore

      - name: Build Release
        run: dotnet build -c Release --no-restore -p:NativeDir=native
        env:
          CI: true

      - name: Verify build output
        run: |
          $expected = @(
            "release/RimWorldAccess/Assemblies/rimworld_access.dll",
            "release/RimWorldAccess/About/About.xml",
            "release/RimWorldAccess/prism.dll",
            "release/RimWorldAccess/libprism.dylib",
            "release/RimWorldAccess/libprism.so",
            "release/changelog.txt"
          )
          foreach ($file in $expected) {
            if (-not (Test-Path $file)) {
              Write-Error "Missing: $file"
              exit 1
            }
          }
          Write-Host "All expected files present"

      - name: Create ZIP
        run: Compress-Archive -Path release/changelog.txt, release/RimWorldAccess -DestinationPath RimWorldAccess-dev.zip

      - name: Update Dev Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev
          name: "Dev Build"
          body: |
            **Automated development build from master branch.**

            Commit: ${{ github.sha }}

            This release is automatically updated with every push to master.
            It is intended for experienced players who want to test the very
            latest features and fixes that might not work properly, or that have
            not yet been fully documented.
            For stable releases, see the versioned releases.
          prerelease: true
          files: RimWorldAccess-dev.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
